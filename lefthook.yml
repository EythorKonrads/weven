# Pre-commit: format and lint the staged files, then re-stage what Prettier fixed.
pre-commit:
  parallel: false
  jobs:
    - name: format
      glob: '*.{js,cjs,mjs,ts,tsx,json,yml,yaml,css}'
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    - name: lint
      glob: '*.{js,cjs,mjs,ts,tsx}'
      run: pnpm exec eslint --max-warnings 0 --no-warn-ignored {staged_files}
