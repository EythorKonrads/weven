<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Friends</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./bs.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="bs scr {{themeClass}}" style="width: 390px; height: 900px">
  <div class="appbar">
    <a href="Main.dc.html" class="ib" aria-label="Back"><svg class="ic" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <span class="ttl">Friends</span>
    <button class="ib" aria-label="Search friends"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></button>
  </div>
  <div class="body" style="gap: 20px">
    <section class="hero" style="gap: 14px">
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="width: 44px; height: 44px; border-radius: 14px; background: rgba(255,255,255,0.12); display: grid; place-items: center"><svg class="ic" viewBox="0 0 24 24"><circle cx="10" cy="8" r="4"></circle><path d="M3 20c0-3.9 3.1-7 7-7"></path><path d="M19 8v6M16 11h6"></path></svg></span>
        <span style="display: flex; flex-direction: column; gap: 2px"><span class="t">Invite friends</span><span class="dim">They join free and see what they owe right away.</span></span>
      </div>
      <div style="display: flex; gap: 10px">
        <button class="btn hbtn" style="height: 42px; flex: 1; font-size: 14px">Share link</button>
        <button class="btn" style="height: 42px; flex: 1; font-size: 14px; background: transparent; color: inherit; border: 1px solid rgba(255,255,255,0.22)">From contacts</button>
      </div>
    </section>

    <div style="display: flex; gap: 8px">
      <button class="pill on" aria-pressed="true">All · 6</button>
      <button class="pill" aria-pressed="false">Owe you</button>
      <button class="pill" aria-pressed="false">You owe</button>
    </div>

    <div class="card list">
      <a href="FriendDetail.dc.html" class="row"><span class="av c2">MK</span><span class="grow"><span class="t">Mikkel Holm</span><span class="sub">3 shared groups</span></span><span class="end"><span class="xs">owes you</span><span class="amt owed">220.00 kr</span></span></a>
      <a href="#" class="row"><span class="av c3">SO</span><span class="grow"><span class="t">Sofie Lund</span><span class="sub">2 shared groups</span></span><span class="end"><span class="xs">you owe</span><span class="amt owe">145.50 kr</span></span></a>
      <a href="#" class="row"><span class="av c4">JO</span><span class="grow"><span class="t">Jonas Berg</span><span class="sub">2 shared groups</span></span><span class="end"><span class="xs">owes you</span><span class="amt owed">96.00 kr</span></span></a>
      <a href="#" class="row"><span class="av c2">AN</span><span class="grow"><span class="t">Anna Krog</span><span class="sub">1 shared group</span></span><span class="pill">Settled</span></a>
      <a href="#" class="row"><span class="av c1">MO</span><span class="grow"><span class="t">Mom</span><span class="sub">Family</span></span><span class="pill">Settled</span></a>
      <div class="row"><span class="av c0"><svg class="ic s" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg></span><span class="grow"><span class="t">freja@mail.dk</span><span class="sub">Invited 2 days ago</span></span><button class="btn btn-s btn-sm">Resend</button></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return { themeClass: (this.props.dark ?? false) ? 'dark' : 'light' }; }
}
</script>
</body>
</html>
