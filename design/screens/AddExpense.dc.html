<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add expense</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./bs.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="bs scr {{themeClass}}" style="width: 390px; height: 1080px">
  <div class="appbar">
    <a href="GroupDetail.dc.html" class="ib" aria-label="Close"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    <span class="ttl">Add expense</span>
    <span style="width: 44px"></span>
  </div>
  <div class="body" style="gap: 20px">
    <div style="display: flex; align-items: center; gap: 8px">
      <span class="sub">With</span>
      <button class="pill acc" style="height: 34px; padding: 0 12px 0 6px; gap: 6px"><span class="tile c4" style="width: 24px; height: 24px; border-radius: 8px"><svg class="ic xs" viewBox="0 0 24 24"><path d="M22 2 11 13"></path><path d="M22 2l-7 20-4-9-9-4z"></path></svg></span>Lisbon trip<svg class="ic xs" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"></path></svg></button>
    </div>

    <div class="card" style="padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px">
      <div style="display: flex; align-items: center; gap: 12px">
        <a href="CurrencySheet.dc.html" class="pill" style="height: 36px; font-size: 14px; padding: 0 10px 0 12px">DKK<svg class="ic xs" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"></path></svg></a>
        <label><span class="sr">Amount</span><input value="320.00" inputmode="decimal" class="big" style="width: 190px; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 48px; padding: 0"></label>
      </div>
      <div class="pill acc" style="height: auto; padding: 6px 12px; font-weight: 500; white-space: normal; text-align: center; gap: 6px"><svg class="ic xs" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h12l-3-3"></path><path d="M17 17H5l3 3"></path></svg><span><b style="font-weight: 600">≈ €42.88</b> in group currency · 1 EUR = 7.4625 DKK, live</span></div>
    </div>

    <div class="card list">
      <label class="row"><button class="tile c1" aria-label="Category: transport" style="width: 40px; height: 40px; border-radius: 12px; border: 0"><svg class="ic s" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="12" rx="2"></rect><path d="M7 7V5h10v2M7 19v2M17 19v2"></path></svg></button><span class="grow"><span class="xs">Name</span><input value="Airport taxi, CPH" style="border: 0; outline: 0; background: transparent; font: 600 15px Inter, sans-serif; color: var(--text); padding: 0"></span></label>
      <a href="#" class="row"><span class="av c1" style="width: 40px; height: 40px">EY</span><span class="grow"><span class="xs">Paid by</span><span class="t">You</span></span><svg class="ic chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"></path></svg></a>
      <a href="SplitSheet.dc.html" class="row"><span class="tile c0" style="width: 40px; height: 40px; border-radius: 12px"><svg class="ic s" viewBox="0 0 24 24"><path d="M11 2a10 10 0 0 0 0 20z"></path><path d="M13 2a10 10 0 0 1 0 20z"></path></svg></span><span class="grow"><span class="xs">Split</span><span class="t">Equally between 5</span><span class="xs">64.00 kr each</span></span><span class="stack"><span class="av sm c1">EY</span><span class="av sm c2">MK</span><span class="av sm c3">SO</span></span><svg class="ic chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"></path></svg></a>
      <a href="#" class="row"><span class="tile c0" style="width: 40px; height: 40px; border-radius: 12px"><svg class="ic s" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></span><span class="grow"><span class="xs">Date</span><span class="t">Wed, 28 Oct 2026</span></span><svg class="ic chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"></path></svg></a>
    </div>

    <section class="sec">
      <span class="lbl">Receipt</span>
      <div style="display: flex; gap: 10px">
        <div style="width: 84px; height: 108px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); position: relative; padding: 12px 10px; display: flex; flex-direction: column; gap: 6px">
          <span style="height: 5px; width: 70%; background: var(--line); border-radius: 3px"></span><span style="height: 5px; width: 90%; background: var(--line); border-radius: 3px"></span><span style="height: 5px; width: 55%; background: var(--line); border-radius: 3px"></span><span style="height: 5px; width: 80%; background: var(--line); border-radius: 3px"></span><span style="height: 5px; width: 40%; background: var(--text); border-radius: 3px; margin-top: auto"></span>
          <button aria-label="Remove receipt" style="position: absolute; top: -8px; right: -8px; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--bg); background: var(--text); color: var(--bg); display: grid; place-items: center; padding: 0"><svg class="ic xs" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
        </div>
        <button style="flex: 1; border-radius: 14px; border: 1.5px dashed var(--line); background: transparent; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font: 600 13px Inter, sans-serif"><svg class="ic" viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h2l2-2h6l2 2h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Take photo</button>
        <button style="flex: 1; border-radius: 14px; border: 1.5px dashed var(--line); background: transparent; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font: 600 13px Inter, sans-serif"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="9" cy="9" r="2"></circle><path d="M21 15l-5-5L5 21"></path></svg>Upload</button>
      </div>
    </section>

    <label class="field"><span class="lbl">Note</span><textarea class="inp" rows="2" style="padding: 12px 14px">Took the big taxi because of the luggage</textarea></label>
  </div>
  <div class="footer"><a href="ExpenseDetail.dc.html" class="btn btn-p">Save expense</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":1080}}'>
class Component extends DCLogic {
  renderVals() { return { themeClass: (this.props.dark ?? false) ? 'dark' : 'light' }; }
}
</script>
</body>
</html>
