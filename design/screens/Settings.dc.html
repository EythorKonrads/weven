<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./bs.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="bs scr {{themeClass}}" style="width: 390px; height: 900px">
  <div class="appbar">
    <a href="Account.dc.html" class="ib" aria-label="Back"><svg class="ic" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <span class="ttl">Settings</span>
    <span style="width: 44px"></span>
  </div>
  <div class="body" style="gap: 22px">
    <section class="sec">
      <span class="lbl">Appearance</span>
      <div role="radiogroup" aria-label="Theme" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
        <button role="radio" aria-checked="true" class="card" style="padding: 8px 8px 12px; display: flex; flex-direction: column; gap: 10px; align-items: center; border: 2px solid var(--acc); font: 600 13px Inter, sans-serif; color: var(--text)">
          <span style="width: 100%; height: 72px; border-radius: 12px; overflow: hidden; display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line)"><span style="background: #F6F6F4; padding: 8px 6px; display: flex; flex-direction: column; gap: 5px"><span style="height: 14px; border-radius: 4px; background: #1C2742"></span><span style="height: 6px; border-radius: 3px; background: #E3E3DF"></span><span style="height: 6px; width: 70%; border-radius: 3px; background: #E3E3DF"></span></span><span style="background: #0E0E0F; padding: 8px 6px; display: flex; flex-direction: column; gap: 5px"><span style="height: 14px; border-radius: 4px; background: #1C2742"></span><span style="height: 6px; border-radius: 3px; background: #2D2D31"></span><span style="height: 6px; width: 70%; border-radius: 3px; background: #2D2D31"></span></span></span>
          <span style="display: flex; align-items: center; gap: 6px"><span class="radio on" style="width: 16px; height: 16px"></span>System</span>
        </button>
        <button role="radio" aria-checked="false" class="card" style="padding: 8px 8px 12px; display: flex; flex-direction: column; gap: 10px; align-items: center; font: 600 13px Inter, sans-serif; color: var(--text)">
          <span style="width: 100%; height: 72px; border-radius: 12px; background: #F6F6F4; border: 1px solid var(--line); padding: 8px; display: flex; flex-direction: column; gap: 5px"><span style="height: 14px; border-radius: 4px; background: #1C2742"></span><span style="height: 6px; border-radius: 3px; background: #E3E3DF"></span><span style="height: 6px; width: 70%; border-radius: 3px; background: #E3E3DF"></span></span>
          <span style="display: flex; align-items: center; gap: 6px"><span class="radio" style="width: 16px; height: 16px"></span>Light</span>
        </button>
        <button role="radio" aria-checked="false" class="card" style="padding: 8px 8px 12px; display: flex; flex-direction: column; gap: 10px; align-items: center; font: 600 13px Inter, sans-serif; color: var(--text)">
          <span style="width: 100%; height: 72px; border-radius: 12px; background: #0E0E0F; border: 1px solid var(--line); padding: 8px; display: flex; flex-direction: column; gap: 5px"><span style="height: 14px; border-radius: 4px; background: #1C2742"></span><span style="height: 6px; border-radius: 3px; background: #2D2D31"></span><span style="height: 6px; width: 70%; border-radius: 3px; background: #2D2D31"></span></span>
          <span style="display: flex; align-items: center; gap: 6px"><span class="radio" style="width: 16px; height: 16px"></span>Dark</span>
        </button>
      </div>
      <span class="xs">System follows your phone or computer's setting.</span>
    </section>

    <section class="sec">
      <span class="lbl">Currency</span>
      <div class="card list">
        <a href="CurrencySheet.dc.html" class="row"><span class="grow"><span class="t">Default currency</span><span class="sub">For new groups and direct expenses</span></span><span class="pill acc">DKK</span><svg class="ic chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"></path></svg></a>
        <div class="row"><span class="grow"><span class="t">Show my totals in one currency</span><span class="sub">Convert balances on Home with live rates</span></span><button class="sw" role="switch" aria-checked="true" aria-label="Show totals in one currency"></button></div>
      </div>
    </section>

    <section class="sec">
      <span class="lbl">Notifications</span>
      <div class="card list">
        <div class="row"><span class="grow"><span class="t">New expenses</span></span><button class="sw" role="switch" aria-checked="true" aria-label="New expenses"></button></div>
        <div class="row"><span class="grow"><span class="t">Comments</span></span><button class="sw" role="switch" aria-checked="true" aria-label="Comments"></button></div>
        <div class="row"><span class="grow"><span class="t">Payments and reminders</span></span><button class="sw" role="switch" aria-checked="true" aria-label="Payments and reminders"></button></div>
        <div class="row"><span class="grow"><span class="t">Weekly summary</span></span><button class="sw" role="switch" aria-checked="false" aria-label="Weekly summary"></button></div>
      </div>
    </section>

    <button class="btn btn-s" style="color: var(--owe)">Delete account</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return { themeClass: (this.props.dark ?? false) ? 'dark' : 'light' }; }
}
</script>
</body>
</html>
