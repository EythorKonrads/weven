<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Currency picker</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./bs.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="bs scr {{themeClass}}" style="width: 390px; height: 844px">
  <div class="appbar" aria-hidden="true"><span class="ib"></span><span class="ttl">Add expense</span><span class="ib"></span></div>
  <div class="scrim"></div>

  <section class="sheet" role="dialog" aria-label="Choose currency" style="top: 64px; gap: 14px">
    <div class="grab"></div>
    <div class="sechead" style="align-items: center">
      <h2 class="disp h2">Currency</h2>
      <a href="AddExpense.dc.html" class="ib" aria-label="Close"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    </div>
    <label class="inp"><svg class="ic s mut" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><span class="sr">Search currencies</span><input placeholder="Search currency or country"></label>
    <div class="xs" style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 50%; background: var(--owed)"></span>Live rates vs EUR (group currency) · updated 2 min ago</div>

    <div class="list">
      <span class="lbl" style="padding: 4px 0">Suggested</span>
      <button class="row" style="padding: 10px 0; border: 0; background: transparent; font: inherit; color: var(--text); text-align: left"><span class="pill acc" style="width: 48px; justify-content: center">DKK</span><span class="grow"><span class="t">Danish krone</span><span class="xs">1 EUR = 7.4625 DKK</span></span><span class="radio on" aria-label="Selected"></span></button>
      <button class="row" style="padding: 10px 0; border: 0; background: transparent; font: inherit; color: var(--text); text-align: left"><span class="pill" style="width: 48px; justify-content: center">EUR</span><span class="grow"><span class="t">Euro</span><span class="xs">Group currency</span></span><span class="radio"></span></button>
      <button class="row" style="padding: 10px 0; border: 0; background: transparent; font: inherit; color: var(--text); text-align: left"><span class="pill" style="width: 48px; justify-content: center">ISK</span><span class="grow"><span class="t">Icelandic króna</span><span class="xs">1 EUR = 144.10 ISK</span></span><span class="radio"></span></button>
      <span class="lbl" style="padding: 14px 0 4px">All currencies</span>
      <button class="row" style="padding: 10px 0; border: 0; background: transparent; font: inherit; color: var(--text); text-align: left"><span class="pill" style="width: 48px; justify-content: center">GBP</span><span class="grow"><span class="t">British pound</span><span class="xs">1 EUR = 0.8640 GBP</span></span><span class="radio"></span></button>
      <button class="row" style="padding: 10px 0; border: 0; background: transparent; font: inherit; color: var(--text); text-align: left"><span class="pill" style="width: 48px; justify-content: center">NOK</span><span class="grow"><span class="t">Norwegian krone</span><span class="xs">1 EUR = 11.71 NOK</span></span><span class="radio"></span></button>
      <button class="row" style="padding: 10px 0; border: 0; background: transparent; font: inherit; color: var(--text); text-align: left"><span class="pill" style="width: 48px; justify-content: center">SEK</span><span class="grow"><span class="t">Swedish krona</span><span class="xs">1 EUR = 11.02 SEK</span></span><span class="radio"></span></button>
      <button class="row" style="padding: 10px 0; border: 0; background: transparent; font: inherit; color: var(--text); text-align: left"><span class="pill" style="width: 48px; justify-content: center">USD</span><span class="grow"><span class="t">US dollar</span><span class="xs">1 EUR = 1.0890 USD</span></span><span class="radio"></span></button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { themeClass: (this.props.dark ?? false) ? 'dark' : 'light' }; }
}
</script>
</body>
</html>
