<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create group</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./bs.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="bs scr {{themeClass}}" style="width: 390px; height: 900px">
  <div class="appbar">
    <a href="Groups.dc.html" class="ib" aria-label="Close"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    <span class="ttl">New group</span>
    <span style="width: 44px"></span>
  </div>
  <div class="body" style="gap: 22px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
      <button aria-label="Change group picture" style="position: relative; border: 0; padding: 0; background: transparent">
        <span class="tile lg c4" style="display: grid"><svg class="ic l" viewBox="0 0 24 24" style="width: 32px; height: 32px"><path d="M22 2 11 13"></path><path d="M22 2l-7 20-4-9-9-4z"></path></svg></span>
        <span style="position: absolute; right: -6px; bottom: -6px; width: 30px; height: 30px; border-radius: 50%; background: var(--acc); color: var(--onacc); border: 3px solid var(--bg); display: grid; place-items: center"><svg class="ic xs" viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h2l2-2h6l2 2h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></span>
      </button>
      <div style="display: flex; gap: 8px" role="group" aria-label="Icon">
        <button class="tile c4" aria-label="Plane icon, selected" style="width: 40px; height: 40px; border: 2px solid var(--acc)"><svg class="ic s" viewBox="0 0 24 24"><path d="M22 2 11 13"></path><path d="M22 2l-7 20-4-9-9-4z"></path></svg></button>
        <button class="tile c2" aria-label="Home icon" style="width: 40px; height: 40px; border: 0"><svg class="ic s" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg></button>
        <button class="tile c3" aria-label="Food icon" style="width: 40px; height: 40px; border: 0"><svg class="ic s" viewBox="0 0 24 24"><path d="M7 3v18"></path><path d="M4 3v5a3 3 0 0 0 6 0V3"></path><path d="M17 21V3c-2 0-3 2-3 6s1 5 3 5"></path></svg></button>
        <button class="tile c1" aria-label="Heart icon" style="width: 40px; height: 40px; border: 0"><svg class="ic s" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-9.3-9A5 5 0 0 1 12 6a5 5 0 0 1 9.3 5C19 15.6 12 20 12 20z"></path></svg></button>
        <button class="tile c0" aria-label="Upload a photo" style="width: 40px; height: 40px; border: 0"><svg class="ic s" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="9" cy="9" r="2"></circle><path d="M21 15l-5-5L5 21"></path></svg></button>
      </div>
    </div>

    <label class="field"><span class="lbl">Group name</span><span class="inp"><input value="Lisbon trip"></span></label>

    <div class="field">
      <span class="lbl">Default currency</span>
      <a href="CurrencySheet.dc.html" class="inp" style="justify-content: space-between"><span style="display: flex; align-items: center; gap: 10px"><span class="pill acc">EUR</span>Euro</span><svg class="ic chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"></path></svg></a>
      <span class="xs">Expenses can still be added in other currencies and converted.</span>
    </div>

    <div class="sec">
      <div class="sechead"><span class="lbl">Members · 4</span><button class="txtbtn" style="height: auto; padding: 0; font-size: 14px">Share invite link</button></div>
      <label class="inp"><svg class="ic s mut" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><span class="sr">Add people</span><input placeholder="Name, email or phone"></label>
      <div class="card list">
        <div class="row"><span class="av c1">EY</span><span class="grow"><span class="t">You</span><span class="sub">Manager</span></span><span class="pill acc">Manager</span></div>
        <div class="row"><span class="av c2">MK</span><span class="grow"><span class="t">Mikkel Holm</span><span class="sub">Friend</span></span><button class="ib" aria-label="Remove Mikkel" style="width: 36px; height: 36px"><svg class="ic s mut" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div>
        <div class="row"><span class="av c3">SO</span><span class="grow"><span class="t">Sofie Lund</span><span class="sub">Friend</span></span><button class="ib" aria-label="Remove Sofie" style="width: 36px; height: 36px"><svg class="ic s mut" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div>
        <div class="row"><span class="av c0"><svg class="ic s" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg></span><span class="grow"><span class="t">jonas@mail.dk</span><span class="sub">Invite will be sent</span></span><button class="ib" aria-label="Remove invite" style="width: 36px; height: 36px"><svg class="ic s mut" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div>
      </div>
    </div>
  </div>
  <div class="footer"><a href="GroupDetail.dc.html" class="btn btn-p">Create group</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return { themeClass: (this.props.dark ?? false) ? 'dark' : 'light' }; }
}
</script>
</body>
</html>
