<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settle up</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./bs.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="bs scr {{themeClass}}" style="width: 390px; height: 844px">
  <div class="appbar">
    <a href="Main.dc.html" class="ib" aria-label="Close"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    <span class="ttl">Settle up</span>
    <span style="width: 44px"></span>
  </div>
  <div class="body" style="gap: 20px">
    <section class="sec" style="gap: 8px">
      <span class="lbl">You pay</span>
      <div class="card list">
        <button class="row" style="border: 0; background: var(--accSoft); font: inherit; color: var(--text); text-align: left; border-radius: 20px"><span class="radio on" aria-label="Selected"></span><span class="av c3">SO</span><span class="grow"><span class="t">Sofie Lund</span><span class="sub">Apartment Nørrebro</span></span><span class="amt owe">145.50 kr</span></button>
      </div>
    </section>

    <section class="sec" style="gap: 8px">
      <span class="lbl">Record a payment to you</span>
      <div class="card list">
        <button class="row" style="border: 0; background: transparent; font: inherit; color: var(--text); text-align: left"><span class="radio"></span><span class="av c2">MK</span><span class="grow"><span class="t">Mikkel Holm</span><span class="sub">2 groups</span></span><span class="amt owed">220.00 kr</span></button>
        <button class="row" style="border: 0; background: transparent; font: inherit; color: var(--text); text-align: left"><span class="radio"></span><span class="av c4">JO</span><span class="grow"><span class="t">Jonas Berg</span><span class="sub">2 groups</span></span><span class="amt owed">96.00 kr</span></button>
      </div>
    </section>

    <section class="card cardpad" style="display: flex; flex-direction: column; gap: 12px">
      <div class="sechead"><span class="lbl">Amount</span><span class="xs">Full balance 145.50 kr</span></div>
      <label class="inp" style="min-height: 60px"><span class="sr">Amount to pay</span><input value="145.50" inputmode="decimal" class="big" style="font-size: 28px"><span class="pill">DKK</span></label>
      <div style="display: flex; gap: 8px"><button class="pill on" aria-pressed="true">Full amount</button><button class="pill" aria-pressed="false">Part of it</button></div>
    </section>
  </div>
  <div class="footer"><a href="SettlePay.dc.html" class="btn btn-p">Continue to pay Sofie</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { themeClass: (this.props.dark ?? false) ? 'dark' : 'light' }; }
}
</script>
</body>
</html>
