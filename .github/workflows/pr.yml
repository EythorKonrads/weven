name: PR checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # paths-filter lists the PR's changed files

jobs:
  # Decides whether `checks` needs to run. The workflow itself always runs (no
  # paths-ignore): `checks` is a required status check, and a required check that
  # never starts blocks the PR forever, while a skipped one counts as passed.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # A file counts only if it matches every pattern, i.e. none of the exclusions.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.claude/**'
              - '!factory/dashboard.*'
              - '!factory/config.json'
              - '!factory/LICENSE'
              - '!.gitignore'
              - '!.editorconfig'

  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      # Local Supabase URL and publishable key (well-known dev defaults, not secrets).
      - name: App env
        run: cp apps/app/.env.example apps/app/.env.local

      # The same script the factory gate and humans run: install, typecheck, lint,
      # tests, web export, then Supabase reset + pgTAP + generated-types check.
      - name: Checks
        run: bash factory/checks.sh

      - name: Prettier
        run: pnpm format:check
