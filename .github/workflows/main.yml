name: Deploy staging

# Merges to main deploy whatever changed to staging: Supabase (migrations + Edge
# Functions) first, then the web app and an EAS Update to the `staging` channel,
# so new app code never meets an old schema.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: Deploy everything, not only what changed
        type: boolean
        default: true

# Never run two deploys at once, and never cancel one halfway through a migration.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      supabase: ${{ inputs.all || steps.filter.outputs.supabase }}
      web: ${{ inputs.all || steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            supabase:
              - 'supabase/**'
              - '.github/workflows/main.yml'
            web:
              - 'apps/app/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/main.yml'

  supabase:
    needs: changes
    if: needs.changes.outputs.supabase == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7

      # Pinned: `latest` pulled CLI 3.0.0, which changed deploy prompts. Upgrade
      # on purpose, together with the local CLI and pr.yml.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      # Applies migrations not yet on staging. Never seeds: seed.sql is local-only.
      - name: Migrate database
        run: supabase db push --linked --yes

      # Bundled by the Supabase API, so no Docker needed. Per-function settings
      # (verify_jwt etc.) come from supabase/config.toml.
      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api --yes

  web:
    needs: [changes, supabase]
    # Runs after a successful Supabase deploy, or when that job was skipped.
    if: >-
      !cancelled() && needs.changes.outputs.web == 'true' &&
      (needs.supabase.result == 'success' || needs.supabase.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: https://weven--staging.expo.app
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # Public values: they are inlined into the bundle anyway.
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    defaults:
      run:
        working-directory: apps/app
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Export web
        run: pnpm exec expo export --platform web

      # Uploads dist/ to EAS Hosting and points the `staging` alias at it.
      - name: Deploy to EAS Hosting
        run: npx -y eas-cli@27.2.0 deploy --non-interactive --alias staging

  app:
    needs: [changes, supabase]
    # Same gate as web: app code changed, and Supabase deployed or was skipped.
    if: >-
      !cancelled() && needs.changes.outputs.web == 'true' &&
      (needs.supabase.result == 'success' || needs.supabase.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # Public values: they are inlined into the bundle anyway.
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    defaults:
      run:
        working-directory: apps/app
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Over-the-air JS update for staging builds. The fingerprint runtime
      # version keeps it from reaching builds with different native code.
      # --environment is required since SDK 55; no EAS-side variables are
      # defined, so the values above are what the bundle gets.
      - name: Publish EAS Update to staging
        run: npx -y eas-cli@27.2.0 update --channel staging --auto --environment preview --non-interactive
